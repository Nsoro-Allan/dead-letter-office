<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Dead Letter Office: a haunted mail room that teaches you to spot scams."
    />
    <title>Dead Letter Office</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="Assets/favicon.png" type="image/x-icon">
  </head>
  <body>
    <div class="moon" aria-hidden="true"></div>
    <div class="fog f1"></div>
    <div class="fog f2"></div>
    <svg class="web w1" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width=".8">
        <path d="M0 0L120 0M0 0L112 48M0 0L84 90M0 0L48 112M0 0L0 120" />
        <path
          d="M30 0Q26 26 0 30M60 0Q50 50 0 60M90 0Q72 72 0 90M118 0Q96 96 0 118"
        />
      </g>
    </svg>
    <svg class="web w2" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width=".8">
        <path d="M0 0L120 0M0 0L112 48M0 0L84 90M0 0L48 112M0 0L0 120" />
        <path
          d="M30 0Q26 26 0 30M60 0Q50 50 0 60M90 0Q72 72 0 90M118 0Q96 96 0 118"
        />
      </g>
    </svg>
    <span class="bat" aria-hidden="true"
      ><svg viewBox="0 0 40 20" fill="currentColor">
        <path
          d="M20 6c2 0 3 2 3 4l3-4c4 0 10 1 14 7-3-2-7-2-9 0-2-2-5-2-7 1l-4-2-4 2c-2-3-5-3-7-1-2-2-6-2-9 0 4-6 10-7 14-7l3 4c0-2 1-4 3-4z"
        /></svg
    ></span>
    <span class="bat" aria-hidden="true"
      ><svg viewBox="0 0 40 20" fill="currentColor">
        <path
          d="M20 6c2 0 3 2 3 4l3-4c4 0 10 1 14 7-3-2-7-2-9 0-2-2-5-2-7 1l-4-2-4 2c-2-3-5-3-7-1-2-2-6-2-9 0 4-6 10-7 14-7l3 4c0-2 1-4 3-4z"
        /></svg
    ></span>
    <span class="bat" aria-hidden="true"
      ><svg viewBox="0 0 40 20" fill="currentColor">
        <path
          d="M20 6c2 0 3 2 3 4l3-4c4 0 10 1 14 7-3-2-7-2-9 0-2-2-5-2-7 1l-4-2-4 2c-2-3-5-3-7-1-2-2-6-2-9 0 4-6 10-7 14-7l3 4c0-2 1-4 3-4z"
        /></svg
    ></span>
    <div class="vig"></div>
    <div class="grain"></div>
    <header class="top">
      <span class="logo">Dead Letter Office</span>
      <span class="ctl"
        ><button
          class="ghost"
          id="sn"
          aria-pressed="false"
          title="Ambient sound and effects"
        >
          Sound off
        </button>
        <button
          class="ghost"
          id="lt"
          aria-pressed="false"
          title="Full-contrast reading mode with keyboard-focusable clues"
        >
          Lights on
        </button></span
      >
    </header>
    <main id="main" class="wrap"></main>
    <div id="scare" role="alert" aria-live="assertive">
      <svg viewBox="0 0 100 120" aria-hidden="true">
        <path
          d="M10 112V45C10 15 30 4 50 4s40 11 40 41v67l-13-11-13 11-14-11-14 11-13-11z"
          fill="#ece6ff"
        />
        <ellipse cx="35" cy="45" rx="9" ry="15" />
        <ellipse cx="65" cy="45" rx="9" ry="15" />
        <ellipse cx="50" cy="82" rx="11" ry="18" />
      </svg>
      <p style="font-size: 1.4rem">You delivered a scam. The dead got in.</p>
    </div>
    <noscript
      ><p style="padding: 20px">
        Dead Letter Office needs JavaScript.
      </p></noscript
    >
    <script src="core.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
